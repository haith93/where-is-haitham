<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Where Is Haitham Now?</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="container" style="min-height:100dvh;display:grid;place-items:center">
    <div class="card" style="text-align:center;max-width:420px">
      <p style="font-size:44px;margin-bottom:8px" aria-hidden="true">📡</p>
      <h1 style="font-size:21px;margin-bottom:10px">You are offline</h1>
      <p class="muted" style="margin-bottom:18px">
        The status board needs a connection, because it shows what is happening right now.
        Nothing was lost — reconnect and try again.
      </p>
      <button class="btn btn-primary btn-block" type="button" onclick="location.reload()">Try again</button>
      <p class="small faint" style="margin-top:14px">
        If you keep seeing this, check your Wi-Fi or mobile data.
      </p>
    </div>
  </main>
</body>
</html>
